# Custom Semgrep rules for DPDPA controls (docs/rules.md §6.2).
#
# Every id here MUST have an entry in mappings/semgrep.yaml, otherwise the
# finding is reported as Unmapped. These rules are bundled into the scan runner
# image and passed to Semgrep with --config so the whole repository is scanned
# for application-code evidence, not just the registry's CI/Docker rules.
#
# NOTE: Semgrep's `metavariable-regex` is a *full* match against the captured
# text, so every pattern is wrapped in `.*` (a bare alternation never matches).
rules:
  - id: dpdpa.python.pii-in-logs
    languages: [python]
    severity: ERROR
    message: >-
      Personal data is passed to a logger. Logging widens access beyond the
      collection purpose (DPDPA §8(4) security safeguards).
    patterns:
      - pattern: $LOG.$METHOD(..., $ARG, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(debug|info|warning|warn|error|exception|critical|log)$'
      - metavariable-regex:
          metavariable: $ARG
          regex: '(?i).*(?:\bemail\b|e[_-]?mail|\bphone\b|\bmobile\b|\bssn\b|\baadhaar\b|\bpan\b|\bpassport\b|\bdob\b|date[_-]?of[_-]?birth|\baddress\b|\bpii\b|personal|customer|user_data).*'

  - id: dpdpa.javascript.pii-in-logs
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Personal data or a request body is logged, exposing it to log readers
      (DPDPA §8(4) security safeguards).
    patterns:
      - pattern-either:
          - pattern: console.$METHOD(..., $ARG, ...)
          - pattern: $LOG.$METHOD(..., $ARG, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(log|info|debug|warn|error|trace)$'
      - metavariable-regex:
          metavariable: $ARG
          regex: '(?i).*(?:\bemail\b|\bphone\b|\buser\b|\bbody\b|\bpayload\b|request|personal|\bpii\b|\bssn\b|\baadhaar\b|password|token).*'

  - id: dpdpa.generic.hardcoded-credential
    languages: [generic]
    severity: ERROR
    message: >-
      A credential literal is present in source, readable by anyone with
      repository access (DPDPA §8(4) security safeguards).
    patterns:
      - pattern-regex: '(?i)(password|passwd|secret|api[_-]?key|apikey|access[_-]?key|private[_-]?key|client[_-]?secret|token)\b["'']?\s*[:=]\s*["''][A-Za-z0-9+/_=@!#%^&*\-]{8,}["'']'

  - id: dpdpa.python.no-consent-check
    languages: [python]
    severity: WARNING
    message: >-
      Personal data is persisted on a write path with no visible consent
      dependency. Confirm that consent is enforced before processing
      (DPDPA §6 consent).
    patterns:
      - pattern-inside: |
          def $FUNC(...):
            ...
      - pattern: $DB.$OP(..., $DATA, ...)
      - metavariable-regex:
          metavariable: $OP
          regex: '^(add|commit|save|flush|insert|update|create|execute)$'
      - metavariable-regex:
          metavariable: $DATA
          regex: '(?i).*(?:\buser\b|\bprofile\b|\bcustomer\b|personal|\bpii\b|consent|email).*'

  - id: dpdpa.javascript.no-consent-check
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Personal data is persisted without a visible consent dependency
      (DPDPA §6 consent).
    patterns:
      - pattern-inside: |
          function $FUNC(...) {
            ...
          }
      - pattern: $MODEL.$OP(..., $DATA, ...)
      - metavariable-regex:
          metavariable: $OP
          regex: '^(save|create|update|insert|upsert|findOneAndUpdate)$'
      - metavariable-regex:
          metavariable: $DATA
          regex: '(?i).*(?:\buser\b|\bprofile\b|\bcustomer\b|personal|\bpii\b|email).*'

  - id: dpdpa.generic.overcollection
    languages: [generic]
    severity: WARNING
    message: >-
      A schema or DTO declares personal-data fields beyond a stated purpose.
      Document the purpose for each field (DPDPA §6 data minimisation).
    patterns:
      - pattern-regex: '(?i)\b(phone|mobile|ssn|aadhaar|pan|passport|date_of_birth|dob)\b\s*[:=]\s*["'']?(string|str|text)["'']?'

  - id: dpdpa.python.consent-withdrawal-missing
    languages: [python]
    severity: WARNING
    message: >-
      A consent record has no withdrawal path. Withdrawal cannot be honoured
      without one (DPDPA §6(4) withdrawal of consent).
    patterns:
      - pattern-regex: '(?i)^class\s+\w*Consent\w*\s*[:(]'
      - pattern-not-regex: '(?i)^\s*def\s+withdraw\w*\s*\('
      - pattern-not-regex: '(?i)^\s*def\s+revoke\w*\s*\('

  - id: dpdpa.generic.unbounded-retention
    languages: [generic]
    severity: WARNING
    message: >-
      A store holds personal data with no visible retention or TTL setting
      (DPDPA §8(4) retention).
    patterns:
      - pattern-regex: '(?i)\b(pii|personal_data|user_data|customer_data)\b.{0,40}\b(table|collection|bucket|model)\b'

  - id: dpdpa.generic.hard-delete-missing
    languages: [generic]
    severity: WARNING
    message: >-
      Deletion is implemented as a soft flag, leaving personal data in place.
      Propagate erasure to derived stores (DPDPA §13 erasure).
    patterns:
      - pattern-regex: '(?i)\b(is_deleted|deleted_at|soft_delete|deleted_flag)\b\s*[:=]'

  - id: dpdpa.javascript.cross-border-sdk
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A third-party SDK is configured with a region outside India. Confirm the
      transfer basis (DPDPA §16 cross-border transfer).
    patterns:
      - pattern-regex: '(?i)\b(region|defaultRegion|location)\b\s*[:=]\s*["''](?!ap-south-1|in-|IN)[a-z0-9-]{2,}["'']'

  - id: dpdpa.generic.children-data-no-age-gate
    languages: [generic]
    severity: WARNING
    message: >-
      Child-directed data collection without a visible age gate. Applicability
      depends on the product audience (DPDPA §9 children's data).
    patterns:
      - pattern-regex: '(?i)\b(child|children|minor|underage|guardian)\b.{0,40}\b(email|name|photo|location)\b'

  - id: dpdpa.generic.privacy-notice-missing
    languages: [generic]
    severity: WARNING
    message: >-
      A collection endpoint has no visible notice link. The notice may be
      rendered by a shared layout; confirm before treating this as a failure
      (DPDPA §5 notice).
    patterns:
      - pattern-regex: '(?i)(app\.(get|post|put)|@app\.(route|get|post)|router\.(get|post))\([^\n]{0,120}(signup|register|collect|onboard)'

  - id: dpdpa.generic.lawful-basis-missing
    languages: [generic]
    severity: WARNING
    message: >-
      Personal data is persisted without a visible lawful-basis marker. Record
      the lawful basis or legitimate use beside the processing activity
      (DPDPA §7 lawful basis).
    patterns:
      - pattern-either:
          - pattern-regex: '(?i)\b(email|phone|user_data|customer_data|personal_data|pii)\b.{0,80}\b(save|store|persist|insert|create|write|update)\b'
          - pattern-regex: '(?i)\b(save|store|persist|insert|create|write|update)\b.{0,80}\b(email|phone|user_data|customer_data|personal_data|pii|user|customer|profile)\b'
      # Match the containing operation so the exclusion overlaps the write.
      # Retain same-line markers for writes outside a function.
      - pattern-not-regex: |-
          (?imx)
          (?(DEFINE)(?<marker>\b(?:lawful_basis|legal_basis|legitimate_use|processing_purpose|lawful\ basis|legal\ basis)\b))
          (?:
            ^(?<indent>\h*)(?:async\h+)?def\h+[^\r\n]+:\h*(?:\#[^\r\n]*)?\R
              (?=(?:(?:\k<indent>\h+\S[^\r\n]*|\h*)\R)*?
                \k<indent>\h+[^\r\n]*(?&marker))
              (?:\k<indent>\h+\S[^\r\n]*(?:\R|\z)|\h*\R)+
            |
            ^[^\r\n]*(?&marker)[^\r\n]*
          )
      # Ignore braces inside strings and comments when scoping a JS operation.
      - pattern-not-regex: |-
          (?ix)
          (?(DEFINE)
            (?<marker>\b(?:lawful_basis|legal_basis|legitimate_use|processing_purpose|lawful\ basis|legal\ basis)\b)
            (?<string>"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)
            (?<comment>/\*(?:(?!\*/)[\s\S])*\*/|//[^\r\n]*)
            (?<skip>(?&string)|(?&comment))
            (?<block>\{(?:(?&skip)|[^{}]++|(?&block))*\})
            (?<marked>\{(?:(?:(?!(?&marker))(?:(?&skip)|[^{}]))++|(?&block))*
              (?:(?&marker)|(?&marked))(?:(?&skip)|[^{}]++|(?&block))*\})
          )
          (?:\bfunction\h*\*?\h*(?:[\w$]+\h*)?\([^{}]*?\)|=>)\s*(?&marked)

  - id: dpdpa.generic.breach-alert-missing
    languages: [generic]
    severity: WARNING
    message: >-
      A security or error event path has no notification hook, so a personal
      data breach may not be escalated to the response process (DPDPA §8(5)
      breach notification).
    patterns:
      # Match the handler header and only its own body: every following line
      # must be strictly more indented than the header. That covers assigned
      # handlers and callbacks without brace parsing, while stopping at a
      # sibling handler so one hook cannot silence its neighbours.
      - pattern-regex: '(?im)^(?<indent>\h*)[^\r\n]{0,80}?\b(except|catch|error_handler|onerror|security_event|audit_failure)\b[^\n]{0,200}(?:\n(?=\k<indent>\h)[ \t]+[^\n]{0,240})*'
      # Suppress only on a real hook call outside strings/comments. A bare word
      # in a log message or comment must not silence a scored finding, and a
      # hook call beyond any fixed line budget must still count.
      - pattern-not-regex: '(?:"(?:\\.|[^"\\])*"|''(?:\\.|[^''\\])*''|`(?:\\.|[^`\\])*`|/\*(?:(?!\*/)[\s\S])*\*/|//[^\r\n]*|\#[^\r\n]*)(*SKIP)(*F)|\b(?:notify|alert|incident|breach|report|webhook|page_oncall)\b\h*\('

  - id: dpdpa.generic.sdf-artifacts-missing
    languages: [generic]
    severity: WARNING
    message: >-
      Documentation discusses personal-data processing without referencing a
      DPO, impact assessment, or audit record. SDF status is a legal
      designation, so confirm applicability before treating this as a failure
      (DPDPA §10 significant data fiduciaries).
    paths:
      include:
        - '**/*.md'
    patterns:
      - pattern-regex: '(?i)\b(personal data|personal_data|pii|privacy notice|data principal)\b'
      # The exclusion must cover the whole Markdown target, not just a reference.
      - pattern-not-regex: '(?is)\A.*\b(dpo|data protection officer|dpia|data protection impact assessment|audit)\b.*\z'
