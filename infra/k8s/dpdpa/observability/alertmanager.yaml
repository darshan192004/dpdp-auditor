# Alertmanager for the internal-only k3s pilot.
# Apply with:
#   kubectl apply -f infra/k8s/dpdpa/observability/alertmanager.yaml
# Replace the receiver placeholder in the ConfigMap at deploy time; see
# docs/runbooks/k3s-pilot-deployment.md.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: dpdpa
  labels:
    app.kubernetes.io/name: dpdpa
    app.kubernetes.io/component: observability
data:
  alertmanager.yml: |
    # One internal receiver for the pilot. Replace REPLACE_AT_DEPLOY with the
    # chosen internal webhook, or swap webhook_configs for email_configs,
    # BEFORE applying this manifest. Alerts arrive with the runbook label and
    # annotations from monitoring/prometheus/rules.yml unchanged; the alert
    # inventory is in docs/observability-alert-coverage.md.
    global:
      resolve_timeout: 5m
    route:
      receiver: internal
      group_by: ['alertname', 'slo_id', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: internal
        webhook_configs:
          - url: 'http://REPLACE_AT_DEPLOY/internal-alerts'
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: dpdpa
  labels:
    app.kubernetes.io/name: dpdpa
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      nodeSelector:
        workload: scanner
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: web
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
              readOnly: true
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: dpdpa
  labels:
    app.kubernetes.io/name: dpdpa
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: web
