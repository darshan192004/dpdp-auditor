# Deploy-time template only. Never commit real values.
# The deploy script replaces REPLACE_AT_DEPLOY with generated credentials.
apiVersion: v1
kind: Secret
metadata:
  name: dpdpa-secrets
  namespace: dpdpa
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_AT_DEPLOY
  REDIS_PASSWORD: REPLACE_AT_DEPLOY
  MINIO_ROOT_USER: REPLACE_AT_DEPLOY
  MINIO_ROOT_PASSWORD: REPLACE_AT_DEPLOY
---
# Deploy-time template for the seeded internal accounts (Task 5).
apiVersion: v1
kind: Secret
metadata:
  name: dpdpa-seed-users
  namespace: dpdpa
type: Opaque
stringData:
  SEED_USERS_JSON: REPLACE_AT_DEPLOY
---
# Deploy-time template for web/orchestrator shared keys.
apiVersion: v1
kind: Secret
metadata:
  name: dpdpa-app-secrets
  namespace: dpdpa
type: Opaque
stringData:
  ORCHESTRATOR_HMAC_KEY: REPLACE_AT_DEPLOY
  ORCHESTRATOR_INTERNAL_KEY: REPLACE_AT_DEPLOY
  NUXT_APP_SECRET: REPLACE_AT_DEPLOY
