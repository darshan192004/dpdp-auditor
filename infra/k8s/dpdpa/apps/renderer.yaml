# Dedicated headless Chromium for report-render.worker.ts (ADR-008).
# There is no apps/renderer source tree: the orchestrator connects to the
# DevTools WebSocket at this Service's port 3000. Task 9 replaces the digest
# placeholder with the resolved dpdpa/chromium image digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renderer
  namespace: dpdpa
  labels:
    app.kubernetes.io/name: dpdpa
    app.kubernetes.io/component: renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: renderer
  template:
    metadata:
      labels:
        app: renderer
        app.kubernetes.io/name: dpdpa
        app.kubernetes.io/component: renderer
    spec:
      nodeSelector:
        workload: scanner
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chromium
          image: registry.dpdpa.svc.cluster.local:5000/dpdpa/chromium@sha256:REPLACE_WITH_CHROMIUM_DIGEST
          command: ['/bin/sh', '-c']
          args:
            - |
              exec "$(command -v chromium || command -v chromium-browser || command -v google-chrome)" \
                --headless=new \
                --no-sandbox \
                --disable-dev-shm-usage \
                --remote-debugging-address=0.0.0.0 \
                --remote-debugging-port=3000 \
                --user-data-dir=/tmp/chromium
          ports:
            - name: ws
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /json/version
              port: ws
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /json/version
              port: ws
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: chromium-data
              mountPath: /tmp
            - name: chromium-shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      volumes:
        - name: chromium-data
          emptyDir: {}
        - name: chromium-shm
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: renderer
  namespace: dpdpa
  labels:
    app.kubernetes.io/name: dpdpa
    app.kubernetes.io/component: renderer
spec:
  type: ClusterIP
  selector:
    app: renderer
  ports:
    - name: ws
      port: 3000
      targetPort: ws
      protocol: TCP
