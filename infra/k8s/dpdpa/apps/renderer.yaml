# Dedicated headless Chromium for report-render.worker.ts (ADR-008).
# There is no apps/renderer source tree: the orchestrator connects to the
# DevTools WebSocket at this Service's port 9222. The pinned image's s6
# service starts Chromium with CHROMIUM_ARGS and socat-forwards 9222 to the
# browser's loopback debug port 9223 (newer Chromium ignores
# --remote-debugging-address and cannot be exposed on 0.0.0.0 directly).
# Task 9 replaces the digest placeholder with the resolved dpdpa/chromium digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renderer
  namespace: dpdpa
  labels:
    app.kubernetes.io/name: dpdpa
    app.kubernetes.io/component: renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: renderer
  template:
    metadata:
      labels:
        app: renderer
        app.kubernetes.io/name: dpdpa
        app.kubernetes.io/component: renderer
    spec:
      nodeSelector:
        workload: scanner
      securityContext:
        # The image's s6 init starts as root, then drops to the chrome user;
        # forcing runAsUser would prevent s6 from starting the browser.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chromium
          image: registry.dpdpa.svc.cluster.local:5000/dpdpa/chromium@sha256:783c7c72f8dc1c85a7671c1f5b13dcd8eb0443bb115126654cd65dfe8eaa1594
          env:
            - name: CHROMIUM_ARGS
              value: '--headless --no-sandbox --disable-dev-shm-usage --disable-crash-reporter --no-crashpad --remote-debugging-port=9223'
          ports:
            - name: ws
              containerPort: 9222
          readinessProbe:
            httpGet:
              path: /json/version
              port: ws
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /json/version
              port: ws
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: chromium-data
              mountPath: /tmp
            - name: chromium-shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
              # s6-setuidgid switches from root to the image's `chrome` user.
              add: ['SETUID', 'SETGID']
      volumes:
        - name: chromium-data
          emptyDir: {}
        - name: chromium-shm
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: renderer
  namespace: dpdpa
  labels:
    app.kubernetes.io/name: dpdpa
    app.kubernetes.io/component: renderer
spec:
  type: ClusterIP
  selector:
    app: renderer
  ports:
    - name: ws
      port: 9222
      targetPort: ws
      protocol: TCP
