# Default-deny plus explicit allows for the internal pilot. Policies are
# additive: every pod is denied by default, then only the flows below are
# permitted. Scan Job pods inherit the labels the Job controller injects
# (`job-name`), so selectors use that key rather than a static app label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: dpdpa
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-web
  namespace: dpdpa
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Ingress]
  ingress:
    - from:
        # The pilot ingress controller runs with hostNetwork on the single node,
        # so its traffic arrives from the node IP rather than a pod IP.
        - ipBlock:
            cidr: 10.0.15.186/32
        # Pod-based controllers (multi-node production) match by namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-orchestrator
  namespace: dpdpa
spec:
  podSelector:
    matchLabels:
      app: orchestrator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 3001
    # Scan Jobs call back to the orchestrator findings endpoint.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dpdpa-scanners
          podSelector:
            matchExpressions:
              - key: job-name
                operator: Exists
      ports:
        - protocol: TCP
          port: 3001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-egress
  namespace: dpdpa
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: orchestrator
      ports:
        - protocol: TCP
          port: 3001
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orchestrator-to-renderer
  namespace: dpdpa
spec:
  podSelector:
    matchLabels:
      app: orchestrator
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: renderer
      ports:
        - protocol: TCP
          port: 9222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orchestrator-to-github
  namespace: dpdpa
spec:
  podSelector:
    matchLabels:
      app: orchestrator
  policyTypes: [Egress]
  # GitHub publishes 100+ rotating web/git CIDRs (api.github.com/meta). Pinning
  # a few of them breaks `git ls-remote` whenever DNS moves to a new range, so
  # allow HTTPS egress generally; ingress remains private-only via TLS.
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-stateful-service-ingress
  namespace: dpdpa
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [postgres, redis, minio, registry]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: orchestrator
        - podSelector:
            matchLabels:
              app: web
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [migrate, seed-users, backup-refresh]
        - podSelector:
            matchExpressions:
              - key: job-name
                operator: Exists
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dpdpa-jobs-to-stateful-services
  namespace: dpdpa
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [migrate, seed-users]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orchestrator-to-renderer-ingress
  namespace: dpdpa
spec:
  podSelector:
    matchLabels:
      app: renderer
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: orchestrator
      ports:
        - protocol: TCP
          port: 9222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orchestrator-to-stateful-services
  namespace: dpdpa
spec:
  podSelector:
    matchLabels:
      app: orchestrator
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: registry
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orchestrator-to-kube-apiserver
  namespace: dpdpa
spec:
  podSelector:
    matchLabels:
      app: orchestrator
  policyTypes: [Egress]
  egress:
    # Required by the in-cluster Kubernetes driver to create/watch scan Jobs.
    # k3s runs kube-apiserver with hostNetwork on the control-plane node, so
    # its address is the node IP rather than a pod IP.
    - to:
        - ipBlock:
            cidr: 10.0.15.186/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              component: kube-apiserver
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orchestrator-to-scanner-jobs
  namespace: dpdpa
spec:
  podSelector:
    matchLabels:
      app: orchestrator
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dpdpa-scanners
          podSelector:
            matchExpressions:
              - key: job-name
                operator: Exists
      ports:
        - protocol: TCP
          port: 3001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-to-postgres
  namespace: dpdpa
spec:
  podSelector:
    matchExpressions:
      - key: job-name
        operator: Exists
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: dpdpa
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: dpdpa-scanners
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scanner-jobs-egress
  namespace: dpdpa-scanners
spec:
  podSelector:
    matchExpressions:
      - key: job-name
        operator: Exists
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dpdpa
          podSelector:
            matchLabels:
              app: orchestrator
      ports:
        - protocol: TCP
          port: 3001
    # The callback URL uses the private ingress hostname, which resolves to
    # the hostNetwork ingress controller on the node IP.
    - to:
        - ipBlock:
            cidr: 10.0.15.186/32
      ports:
        - protocol: TCP
          port: 443
    # GitHub web/git smart-HTTP addresses rotate across 100+ CIDRs; allow HTTPS
    # egress generally so clone/ls-remote cannot break on a DNS range change.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
