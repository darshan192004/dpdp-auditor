apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dpdpa
  labels:
    app.kubernetes.io/name: dpdpa
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: dpdpa
        app.kubernetes.io/component: web
    spec:
      nodeSelector:
        workload: scanner
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.dpdpa.svc.cluster.local:5000/dpdpa/web:1.0.0-pilot.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: ORCHESTRATOR_URL
              value: http://orchestrator:3001
            - name: ORCHESTRATOR_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: dpdpa-app-secrets
                  key: ORCHESTRATOR_HMAC_KEY
            - name: ORCHESTRATOR_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: dpdpa-app-secrets
                  key: ORCHESTRATOR_INTERNAL_KEY
            - name: NUXT_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: dpdpa-app-secrets
                  key: NUXT_APP_SECRET
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dpdpa-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379
            - name: NUXT_PUBLIC_APP_URL
              value: https://dpdpa.pride.improwised.dev
            - name: NUXT_PUBLIC_PASSWORD_LOGIN_ENABLED
              value: 'true'
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dpdpa
  labels:
    app.kubernetes.io/name: dpdpa
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
