apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backups
  namespace: dpdpa
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: dpdpa
spec:
  schedule: '0 2 * * *'
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            workload: scanner
          containers:
            - name: pg-backup
              image: postgres:16-alpine
              command:
                - sh
                - -c
                - |
                  set -e
                  pg_dump -h postgres -U dpdpa dpdpa_auditor | gzip > "/backups/dpdpa-$$(date +%F).sql.gz"
                  find /backups -name 'dpdpa-*.sql.gz' -mtime +30 -delete
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dpdpa-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: pg-backups
