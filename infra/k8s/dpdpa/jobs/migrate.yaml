apiVersion: batch/v1
kind: Job
metadata:
  name: dpdpa-migrate
  namespace: dpdpa
  labels:
    app.kubernetes.io/name: dpdpa
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpdpa
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      nodeSelector:
        workload: scanner
      containers:
        - name: migrate
          image: registry.dpdpa.svc.cluster.local:5000/dpdpa/orchestrator@sha256:8a57b2179d25dd14061a073495f85e33d50e5ab8d85299bd0cada007a5d190c8
          command:
            [
              '/nodejs/bin/node',
              'apps/orchestrator/node_modules/prisma/build/index.js',
              'migrate',
              'deploy',
              '--schema',
              'apps/orchestrator/prisma/schema.prisma',
            ]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dpdpa-db
                  key: DATABASE_URL
          securityContext:
            # Prisma CLI writes its engine cache at startup. The directory is
            # owned by UID 65532 in the distroless image, so run as that UID;
            # root with drop:ALL lacks CAP_DAC_OVERRIDE and cannot write it.
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
