[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dpdpa-scan-runner"
version = "0.1.0"
description = "Ephemeral DPDPA scan runner: clone, run scanners, normalise, callback."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
run-scan = "scan_runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scan_runner"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "E",
  "EM",
  "F",
  "G",
  "I",
  "LOG",
  "N",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "TRY",
  "UP",
  "W",
]
ignore = [
  # subprocess is always called with an argument list of pinned binaries
  "S603",
  "S607",
  # non-cryptographic randomness is never used; hashes are not password hashes
  "S311",
  # error messages are built by callers and logged with structured context
  "TRY003",
  "EM101",
  "EM102",
  # allow unicode in docstrings/comments (the docs use typographic dashes)
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG001", "ARG002", "S101", "S105", "S106"]
"scripts/**" = ["ANN201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["scan_runner"]
branch = true
