# Local Development Environment (P1-08)
#
# Services:
# - postgres:16-alpine — primary database
# - redis:7-alpine — cache and BullMQ queue backend
# - mailpit — SMTP catcher for email testing
#
# Usage:
#   docker compose up -d           # start all services
#   docker compose logs -f         # view logs
#   docker compose down            # stop all services
#   docker compose down -v         # stop and remove volumes (fresh start)
#
# Connection details:
#   Postgres: postgresql://postgres:postgres@localhost:5432/dpdpa_auditor
#   Redis:    redis://localhost:6379
#   Mailpit:  SMTP localhost:1025, web UI http://localhost:8025

services:
  postgres:
    image: postgres:16-alpine
    container_name: dpdpa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dpdpa_auditor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dpdpa_auditor']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dpdpa-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: dpdpa-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '1025']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
