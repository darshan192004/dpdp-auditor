name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    name: AI PR review
    if: (github.event_name == 'issue_comment' && github.event.sender.type != 'Bot' && github.event.issue.pull_request && github.event.issue.state == 'open') || (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve active PR configuration
        id: context
        uses: actions/github-script@v8
        with:
          script: |
            const resolve = require('./.github/scripts/pr-agent-context.cjs');
            await resolve({ github, context, core });

      - name: PR Agent action step
        id: pragent
        if: steps.context.outputs.review == 'true'
        uses: the-pr-agent/pr-agent@v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_CONFIG_BRANCH: ${{ steps.context.outputs.config_sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
