name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-lint:
    name: Docs lint (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            README.md
            docs/*.md
            docs/adr/*.md

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Lint workflows
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint -color

  code:
    name: Code CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: pnpm security:audit

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Semgrep security audit scan
        # The semgrep image requires the code mounted at /src (validated locally:
        # 0 findings, 90 rules). --error makes any finding fail the job.
        run: >
          docker run --rm -v "${PWD}:/src" -w /src
          semgrep/semgrep semgrep scan
          --config p/security-audit --config p/typescript
          --error --metrics=off

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan full history for secrets
        run: >
          docker run --rm -v "$PWD":/repo -w /repo
          zricethezav/gitleaks:v8.30.1 git
          --no-banner --redact
          --log-opts="--all"
