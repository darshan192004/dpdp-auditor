name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs-lint:
    name: Docs lint (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            README.md
            docs/*.md

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Lint workflows
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint -color
