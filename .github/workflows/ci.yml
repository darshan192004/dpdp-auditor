name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-lint:
    name: Docs lint (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            README.md
            docs/*.md
            docs/adr/*.md

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Lint workflows
        run: docker run --rm -v "${{ github.workspace }}":/repo -w /repo rhysd/actionlint -color

  code:
    name: Code CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: pnpm security:audit

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Semgrep security audit scan
        # The semgrep image requires the code mounted at /src (validated locally:
        # 0 findings, 90 rules). --error makes any finding fail the job.
        run: >
          docker run --rm -v "${{ github.workspace }}:/src" -w /src
          semgrep/semgrep semgrep scan
          --config p/security-audit --config p/typescript
          --error --metrics=off

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan full history for secrets
        run: >
          docker run --rm -v "${{ github.workspace }}":/repo -w /repo
          zricethezav/gitleaks:v8.30.1 git
          --no-banner --redact
          --log-opts="--all"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install Playwright chromium
        # Via the workspace package: `npx` runs from the repo root, where the
        # binary is not on node_modules/.bin (pnpm does not hoist it).
        run: pnpm --filter @dpdpa/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @dpdpa/web build

      - name: Run e2e tests
        run: pnpm --filter @dpdpa/web exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
